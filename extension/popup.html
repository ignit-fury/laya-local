<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #0f0f13;
    --panel: #1a1a24;
    --border: #2a2a3a;
    --text: #d4d4e0;
    --muted: #7a7a8a;
    --accent: #7c8aff;
    --good: #6ee7b7;
    --warn: #fcd34d;
    --bad: #f87171;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 300px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    line-height: 1.5;
  }
  .header {
    background: var(--panel);
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header .logo {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 12px;
  }
  .header h1 { font-size: 13px; font-weight: 600; }
  .header .version { margin-left: auto; color: var(--muted); font-size: 11px; }
  .body { padding: 14px; }
  .section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .status-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .dot.online  { background: var(--good); box-shadow: 0 0 6px var(--good); }
  .dot.offline { background: var(--bad); box-shadow: 0 0 6px var(--bad); }
  .dot.unknown { background: var(--warn); box-shadow: 0 0 6px var(--warn); }
  .stat {
    display: flex; justify-content: space-between;
    padding: 4px 0; font-size: 12px; border-bottom: 1px solid var(--border);
  }
  .stat:last-child { border-bottom: none; }
  .stat-key { color: var(--muted); }
  .stat-val { font-weight: 500; }
  .prob-bar {
    height: 6px; background: var(--border); border-radius: 3px;
    overflow: hidden; margin-top: 6px;
  }
  .prob-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }
  .btn {
    display: block; width: 100%; padding: 9px;
    border: 1px solid var(--accent-dim); background: var(--accent-dim);
    color: #fff; border-radius: 6px; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: background 0.15s;
  }
  .btn:hover { background: var(--accent); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-secondary { background: transparent; border-color: var(--border); color: var(--text); }
  .btn-secondary:hover { background: var(--panel); }
  .footer { text-align: center; padding: 8px; font-size: 11px; color: var(--muted); }
  .error-msg { color: var(--bad); font-size: 12px; margin-top: 4px; }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none; }
  .prob-high   { background: var(--good); }
  .prob-mid    { background: var(--warn); }
  .prob-low    { background: var(--bad); }
  #probFill.good  { background: var(--good); }
  #probFill.mid   { background: var(--warn); }
  #probFill.low   { background: var(--bad); }
</style>
</head>
<body>

<div class="header">
  <div class="logo">L</div>
  <h1>Laya Study Mode</h1>
  <span class="version">v0.1.0</span>
</div>

<div class="body">

  <div class="section">
    <div class="section-label">Server</div>
    <div class="status-row">
      <div class="dot unknown" id="serverDot"></div>
      <span id="serverText">Checking...</span>
    </div>
  </div>

  <div class="section hidden" id="resultSection">
    <div class="section-label">Classification</div>
    <div class="stat">
      <span class="stat-key">Probability</span>
      <span class="stat-val" id="probValue">—</span>
    </div>
    <div class="prob-bar">
      <div class="prob-fill" id="probFill" style="width: 0%;"></div>
    </div>
    <div class="stat" style="margin-top: 6px;">
      <span class="stat-key">Inference</span>
      <span class="stat-val" id="inferTime">—</span>
    </div>
    <div class="stat">
      <span class="stat-key">Question</span>
      <span class="stat-val" id="questionText">—</span>
    </div>
  </div>

  <div class="section hidden" id="errorSection">
    <div class="section-label">Error</div>
    <div class="error-msg" id="errorText"></div>
  </div>

  <button class="btn" id="classifyBtn">Classify This Page</button>
</div>

<div class="footer">
  Local inference · data never leaves your machine<br>
  Powered by <a href="https://github.com/NandhaKishorM/laya" style="color:var(--accent)">Laya</a>
</div>

<script src="popup.js"></script>
</body>
</html>
